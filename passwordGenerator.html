        <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Password Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Secure Password Generator</h2>
    
    <div class="mb-3">
      <label for="length" class="form-label">Length of Password</label>
      <input type="number" id="length" class="form-control" min="4" max="50" value="12">
    </div>

    <div class="form-check">
      <input type="checkbox" id="includeNumbers" class="form-check-input">
      <label class="form-check-label" for="includeNumbers">Include Numbers</label>
    </div>

    <div class="form-check">
      <input type="checkbox" id="includeUppercase" class="form-check-input">
      <label class="form-check-label" for="includeUppercase">Include Uppercase Letters</label>
    </div>

    <div class="form-check">
      <input type="checkbox" id="includeSpecial" class="form-check-input">
      <label class="form-check-label" for="includeSpecial">Include Special Characters</label>
    </div>

    <button class="btn btn-primary mt-3" onclick="generatePassword()">Generate Password</button>

    <div class="mt-3">
      <label for="output" class="form-label">Generated Password</label>
      <input type="text" id="output" class="form-control" readonly>
    </div>
  </div>

  <script src="script2.js"></script>
</body>
</html>
